<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jafrabad Premier League 2026</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0}
header{background:#16a34a;padding:12px;text-align:center;font-weight:bold}
.wrap{padding:12px}
.card{background:#1e293b;border-radius:8px;padding:10px;margin:8px 0}
input,select,button{width:100%;padding:8px;border-radius:6px;border:0;margin:6px 0}
button{background:#16a34a;color:#fff;font-weight:bold}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #334155;padding:6px;text-align:center}
th{background:#16a34a}
.hidden{display:none}
img.logo{height:30px}
</style>
</head>
<body>
<header>🏆 Jafrabad Premier League 2026</header>
<div class="wrap">

<div id="loginBox" class="card">
  <h3>Admin Login</h3>
  <input id="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="card hidden">
  <h3>Add / Update Team</h3>
  <input id="teamName" placeholder="Team Name">
  <select id="teamGroup"><option>A</option><option>B</option></select>
  <input id="teamLogo" type="file">
  <button onclick="saveTeam()">Save Team</button>

  <h3>Add Match Result</h3>
  <select id="group"><option>A</option><option>B</option></select>
  <input id="t1" placeholder="Team 1">
  <input id="s1" type="number" placeholder="Score 1">
  <input id="t2" placeholder="Team 2">
  <input id="s2" type="number" placeholder="Score 2">
  <button onclick="addMatch()">Save Result</button>

  <h3>Top Scorer</h3>
  <input id="player" placeholder="Player Name">
  <input id="pteam" placeholder="Team">
  <button onclick="addGoal()">Add Goal</button>
</div>

<div class="card">
  <h3>Group A</h3>
  <table><thead>
    <tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
  </thead><tbody id="A"></tbody></table>
</div>

<div class="card">
  <h3>Group B</h3>
  <table><thead>
    <tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
  </thead><tbody id="B"></tbody></table>
</div>

<div class="card">
  <h3>Top Scorers</h3>
  <div id="scorers"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { /* your keys */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ref = doc(db,"tournament","jpl2026");

async function init(){
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{teams:{},groups:{A:{},B:{}},scorers:{}});
  }
  onSnapshot(ref,(snap)=>render(snap.data()));
}
init();

window.login = async ()=>{
  await signInWithEmailAndPassword(auth,email.value,password.value);
  loginBox.classList.add("hidden");
  adminPanel.classList.remove("hidden");
};

window.saveTeam = async ()=>{
  const snap = await getDoc(ref);
  const data = snap.data();
  const file = teamLogo.files[0];
  let logo = "";
  if(file){
    logo = await new Promise(res=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.readAsDataURL(file);
    });
  }
  data.teams[teamName.value]={group:teamGroup.value,logo};
  data.groups[teamGroup.value][teamName.value] ||= {P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};
  await setDoc(ref,data);
};

window.addMatch = async ()=>{
  const snap = await getDoc(ref);
  const d = snap.data();
  const g = group.value, a=d.groups[g][t1.value], b=d.groups[g][t2.value];
  a.P++; b.P++; a.GF+=+s1.value; a.GA+=+s2.value; b.GF+=+s2.value; b.GA+=+s1.value;
  if(+s1.value > +s2.value){a.W++;a.Pts+=3;b.L++;} 
  else if(+s2.value > +s1.value){b.W++;b.Pts+=3;a.L++;} 
  else {a.D++;b.D++;a.Pts++;b.Pts++;}
  a.GD=a.GF-a.GA; b.GD=b.GF-b.GA;
  await setDoc(ref,d);
};

window.addGoal = async ()=>{
  const snap = await getDoc(ref);
  const d = snap.data();
  const key = player.value+" ("+pteam.value+")";
  d.scorers[key] = (d.scorers[key]||0)+1;
  await setDoc(ref,d);
};

function render(data){
  ["A","B"].forEach(g=>{
    const rows = Object.entries(data.groups[g]).sort((a,b)=>b[1].Pts-a[1].Pts||b[1].GD-a[1].GD||b[1].GF-a[1].GF);
    document.getElementById(g).innerHTML = rows.map(([name,s])=>`
      <tr><td>${name}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td><td>${s.GF}</td><td>${s.GA}</td><td>${s.GD}</td><td>${s.Pts}</td></tr>
    `).join("");
  });
  document.getElementById("scorers").innerHTML = Object.entries(data.scorers)
    .sort((a,b)=>b[1]-a[1])
    .map(s=>`<div class="card">${s[0]} - ${s[1]} goals</div>`).join("");
}
</script>
</body>
</html>
